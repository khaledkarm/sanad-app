name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sanad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "Sanad v1.${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
